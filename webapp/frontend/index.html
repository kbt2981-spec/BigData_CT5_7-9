<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Giám Sát Gian Lận Thời Gian Thực</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-high { background-color: #dc3545; }
        .badge-medium { background-color: #ffc107; color: black; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <h2 class="mb-4 text-primary">🛡️ Hệ Thống Giám Sát & Thẩm Định Gian Lận (PaySim)</h2>
        
        <!-- Thống kê nhanh -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-white p-3 shadow-sm border-0">
                    <h6>Precision@200</h6>
                    <h3 class="text-success" id="metric-precision">0.915</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white p-3 shadow-sm border-0">
                    <h6>Chỉ số Drift (PSI)</h6>
                    <h3 class="text-info" id="metric-psi">0.032</h3>
                </div>
            </div>
        </div>

        <!-- Bảng Cảnh báo Thời gian thực -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="m-0">Hàng Đợi Cảnh Báo Rủi Ro Cao</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="loadCanhBao()">🔄 Làm mới</button>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Thời Gian</th>
                            <th>Mã Giao Dịch</th>
                            <th>Tài Khoản Nguồn</th>
                            <th>Số Tiền (VND)</th>
                            <th>Điểm Rủi Ro</th>
                            <th>Thao Tác Thẩm Định</th>
                        </tr>
                    </thead>
                    <tbody id="tbl-canh-bao">
                        <!-- Dữ liệu JS sẽ điền vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thẩm định -->
    <div class="modal fade" id="modalThamDinh" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Ghi Nhận Thẩm Định Giao Dịch</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formThamDinh">
                        <div class="mb-3">
                            <label class="form-label">Mã Giao Dịch</label>
                            <input type="text" class="form-control" id="modal-magd" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kết Luận</label>
                            <select class="form-select" id="modal-ketluan">
                                <option value="GIAN_LAN">⚠️ GIAN LẬN (CONFIRMED FRAUD)</option>
                                <option value="HOP_LE">✅ HỢP LỆ (LEGITIMATE)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Người Thẩm Định</label>
                            <input type="text" class="form-control" id="modal-nguoi" value="ThamDinhVien_01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi Chú</label>
                            <textarea class="form-control" id="modal-ghichu" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="guiKetLuan()">Lưu Kết Luận</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let modalInstance;

        document.addEventListener("DOMContentLoaded", () => {
            modalInstance = new bootstrap.Modal(document.getElementById('modalThamDinh'));
            loadCanhBao();
            // Tự động làm mới mỗi 5 giây
            setInterval(loadCanhBao, 5000);
        });

        async function loadCanhBao() {
            try {
                const res = await fetch(`${API_BASE}/canh-bao`);
                const json = await res.json();
                if (json.status === "success") {
                    renderTable(json.data);
                }
            } catch (err) {
                console.error("Lỗi tải dữ liệu cảnh báo:", err);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("tbl-canh-bao");
            tbody.innerHTML = "";
            data.forEach(item => {
                const scoreBadge = item.diem_rui_ro >= 0.8 ? 'badge-high' : 'badge-medium';
                tbody.innerHTML += `
                    <tr>
                        <td>${item.thoi_gian || 'N/A'}</td>
                        <td><strong>${item.ma_giao_dich}</strong></td>
                        <td>${item.tai_khoan_nguon}</td>
                        <td>${Number(item.so_tien).toLocaleString('vi-VN')}</td>
                        <td><span class="badge ${scoreBadge}">${(item.diem_rui_ro * 100).toFixed(1)}%</span></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="openModal('${item.ma_giao_dich}')">Thẩm Định</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal(maGD) {
            document.getElementById("modal-magd").value = maGD;
            modalInstance.show();
        }

        async function guiKetLuan() {
            const payload = {
                ma_giao_dich: document.getElementById("modal-magd").value,
                ket_luan: document.getElementById("modal-ketluan").value,
                nguoi_tham_dinh: document.getElementById("modal-nguoi").value,
                ghi_chu: document.getElementById("modal-ghichu").value
            };

            const res = await fetch(`${API_BASE}/giao-dich/ket-luan`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Đã lưu kết luận thành công!");
                modalInstance.hide();
                loadCanhBao();
            } else {
                alert("Lỗi khi ghi nhận phản hồi!");
            }
        }
    </script>
</body>
</html>
